<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1b2536" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="500" fill="#0b0f17" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Title Header -->
  <text x="25" y="35" fill="#00e5ff" font-family="monospace" font-size="14" font-weight="bold">AI LABMATE // INSPECTION WORKSTATION - ARDUINO + DHT11</text>
  <text x="750" y="35" fill="#f43f5e" font-family="monospace" font-size="12" text-anchor="end">CRITICAL FAULT: POWER INVERSION</text>
  <line x1="25" y1="45" x2="775" y2="45" stroke="#1d2738" stroke-width="2"/>

  <!-- Arduino Board -->
  <rect x="100" y="100" width="260" height="320" rx="8" fill="#0d5c75" stroke="#1483a5" stroke-width="2"/>
  <text x="120" y="130" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">Arduino Uno</text>
  <!-- USB Port -->
  <rect x="150" y="70" width="60" height="35" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Pins -->
  <rect x="335" y="180" width="20" height="200" fill="#1e293b"/>
  <text x="280" y="210" fill="#00e5ff" font-family="monospace" font-size="11">D2 (Data)</text>
  <text x="280" y="270" fill="#ef4444" font-family="monospace" font-size="11">5V (VCC)</text>
  <text x="280" y="300" fill="#3b82f6" font-family="monospace" font-size="11">GND</text>

  <!-- DHT11 Sensor -->
  <rect x="520" y="160" width="180" height="200" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="540" y="180" width="140" height="80" rx="4" fill="#172554"/>
  <text x="565" y="225" fill="#60a5fa" font-family="monospace" font-size="16" font-weight="bold">DHT11</text>
  <!-- Pins on DHT11 -->
  <text x="540" y="340" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="bold">P1:VCC</text>
  <text x="580" y="340" fill="#00e5ff" font-family="monospace" font-size="10">P2:DATA</text>
  <text x="630" y="340" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">P4:GND</text>

  <!-- Wires WITH SWAPPED CRITICAL ERROR -->
  <!-- 5V (Red) going to P4 (GND)! -->
  <path d="M 345 265 C 420 265, 450 370, 640 350" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- GND (Black) going to P1 (VCC)! -->
  <path d="M 345 295 C 420 295, 450 300, 550 350" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <!-- Data (Yellow) going to P2 -->
  <path d="M 345 205 C 420 205, 480 320, 595 350" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>

  <!-- Warning Box -->
  <rect x="500" y="140" width="220" height="240" fill="rgba(244, 63, 94, 0.12)" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 3"/>
  <rect x="500" y="125" width="180" height="18" fill="#f43f5e"/>
  <text x="505" y="138" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">CRITICAL: VCC/GND INVERTED</text>
</svg>
